
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tenantcore
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tenantcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantcore -d tenantcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tenantcore:test_password@localhost:5432/tenantcore_test
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Verify environment
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: HTTP and database integration tests
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm build

      - name: Install test browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser authentication journey
        run: pnpm --filter web test:e2e
