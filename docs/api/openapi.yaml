openapi: 3.1.0
info:
  title: TenantCore API
  version: 0.5.0
  description: Personal identity, rotating sessions, email verification/recovery, organizations, invitations, membership hierarchy, ownership and tenant audit. All management reads require OWNER/ADMIN and verified identity. All mutations require exact Origin and application/json, including DELETE with an empty JSON object. Management limits are 60/minute/endpoint/IP, except sending/reissuing and acceptance at 10/minute. Tenant responses are no-store.
servers:
  - url: http://localhost:3001
paths:
  /live:
    get:
      summary: Minimal process liveness without dependency access
      responses:
        '200':
          description: Process can serve requests; no dependency/version information
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, const: ok } } }
  /ready:
    get:
      summary: Minimal bounded PostgreSQL readiness
      description: Transaction acquisition/query timeouts are bounded. This does not prove SMTP delivery or production capacity. Replies include server-generated X-Request-Id and Cache-Control no-store.
      responses:
        '200':
          description: Database reachable; no connection details
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, const: ok } } }
        '503': { description: Generic service unavailability without database diagnostics }
  /health:
    get:
      summary: Check API and database availability
      responses:
        '200':
          description: Database reachable
        '503':
          description: Database unavailable
  /auth/register:
    post:
      summary: Create a personal account without starting a session
      description: Email is trimmed/lowercased. Existing email receives the same response and its password is never replaced.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '202':
          description: Generic account creation confirmation
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/login:
    post:
      summary: Verify credentials and set fresh access/refresh cookies
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '204': { $ref: '#/components/responses/SessionCookies' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/me:
    patch:
      summary: Update only the authenticated account's display name
      description: Requires the existing session and exact Origin. Email, password, user IDs, tenant IDs and roles are not assignable. Writes personal audit with changed field names only, never the name value. No verified-email requirement for personal settings.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80, description: Trimmed display name }
      responses:
        '200':
          description: Updated public personal identity; no-store
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: '#/components/schemas/User' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
    get:
      summary: Read the authenticated personal account
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Public user projection; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/refresh:
    post:
      summary: Rotate both cookies within the original seven-day lifetime
      description: Reusing a revoked refresh token revokes its entire family. Concurrent renewals count as replay.
      security: [{ refreshCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmptyJson' }
      responses:
        '204': { $ref: '#/components/responses/SessionCookies' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/logout:
    post:
      summary: Revoke the current family and clear cookies (idempotent)
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmptyJson' }
      responses:
        '204':
          description: Cookies cleared, including when there was no session
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/resend-verification:
    post:
      summary: Request a new verification email
      description: Same generic 202 for eligible, unknown, verified, cooldown and delivery failure cases. Does not promise delivery.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/EmailQueued' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/forgot-password:
    post:
      summary: Request password recovery without disclosing account existence
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/EmailQueued' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/verify-email:
    post:
      summary: Consume a one-use, 30-minute email verification token
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailToken' }
      responses:
        '204': { description: Email ownership verified; no session is created }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/reset-password:
    post:
      summary: Reset credentials and revoke all sessions and outstanding email tokens
      description: Requires a one-use 15-minute reset token. Also proves email ownership. Login is required afterwards.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmailToken'
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
      responses:
        '204': { description: Password updated and cookies cleared; no auto-login }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '429': { $ref: '#/components/responses/Throttled' }
  /organizations:
    get:
      summary: List the caller's organizations and organization-relative roles
      description: Requires verified email. Bounded membership pagination, no global tenant count; Cache-Control no-store.
      security: [{ accessCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Only organizations whose membership belongs to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, hasMore]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Organization' } }
                  limit: { type: integer }
                  offset: { type: integer }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Email verification required }
        '429': { description: Organization request limit exceeded }
    post:
      summary: Atomically create an organization and its caller's OWNER membership
      description: Requires verified email. Slug normalized by trimming/lowercasing; global collisions return 409. Clients cannot supply role, userId or organizationId.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrganizationInput'
              required: [name, slug]
      responses:
        '201': { $ref: '#/components/responses/OrganizationResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification required or Origin rejected }
        '409': { description: Slug unavailable; no organization or membership created }
        '429': { description: Organization creation limit exceeded (10/minute/IP) }
  /organizations/{organizationId}:
    parameters:
      - in: path
        name: organizationId
        required: true
        schema: { type: string, format: uuid }
        description: Stable UUIDv4. Not a claim of membership or authorization.
    get:
      summary: Read a public organization projection as a verified member
      security: [{ accessCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrganizationResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Email verification required }
        '404': { description: Organization absent or caller is not a member; identical response }
        '429': { description: Organization request limit exceeded }
    patch:
      summary: Update organization name/slug as OWNER or ADMIN
      description: Membership and role are read in the locked write transaction. MEMBER/VIEWER cannot edit. No tenant/role fields can be assigned.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrganizationInput'
              minProperties: 1
      responses:
        '200': { $ref: '#/components/responses/OrganizationResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification required, role insufficient or Origin rejected }
        '404': { description: Organization absent or caller is not a member }
        '409': { description: Slug unavailable; stored settings unchanged }
        '429': { description: Organization request limit exceeded }
  /organizations/{organizationId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Real administrative metrics and five recent tenant activities
      description: Verified OWNER/ADMIN only. Reauthorizes under the organization lock shared with tenant writes. Pending counts only PENDING and not-yet-expired records, not inviter eligibility. Recent activity excludes personal identity events and raw audit metadata. All counts are scoped to the authorized tenant.
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Live dashboard projection; Cache-Control no-store and X-Request-Id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification or OWNER/ADMIN management permission required }
        '404': { description: Organization absent or caller is not a member; indistinguishable }
        '429': { description: Management request limit exceeded (60/minute/endpoint/IP) }
  /organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: List members as OWNER/ADMIN
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { in: query, name: search, schema: { type: string, maxLength: 80 }, description: Case-insensitive name/email substring in this tenant only }
      responses:
        '200':
          description: Memberships ordered by createdAt/id ascending; no global counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManagementPage'
                  - properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification required or management role insufficient }
        '404': { description: Organization absent or caller is not a member }
        '429': { description: Management request limit exceeded }
  /organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - { in: path, name: membershipId, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change another member's non-owner role
      description: OWNER manages ADMIN/MEMBER/VIEWER. ADMIN can change only MEMBER/VIEWER to MEMBER/VIEWER. Self and OWNER changes are forbidden.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Updated member; role is immediately effective; audited in the same transaction
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties: { member: { $ref: '#/components/schemas/Member' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification, self or role policy rejected }
        '404': { description: Organization or member absent in caller's authorized scope }
        '429': { description: Management request limit exceeded }
    delete:
      summary: Remove another non-owner member
      description: Same target hierarchy as role changes. The current owner cannot be removed; transfer first. Removed membership loses tenant access on the next request.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmptyJson' }
      responses:
        '204': { description: Membership removed and audited }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification, self or role policy rejected }
        '404': { description: Organization or member absent in caller's authorized scope }
        '429': { description: Management request limit exceeded }
  /organizations/{organizationId}/ownership-transfer:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      summary: Atomically transfer sole ownership to an existing verified member
      description: OWNER only. Previous owner becomes ADMIN. Ordinary invitation/role endpoints never assign OWNER. Concurrent transfer/removal uses the same organization lock. Legacy zero/multiple owners require review instead of automatic repair.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [membershipId]
              properties: { membershipId: { type: string, format: uuid } }
      responses:
        '200': { description: Ownership transferred and audited atomically; message returned }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification or OWNER role required }
        '404': { description: Organization or target absent in authorized scope }
        '409': { description: Same owner, unverified target or ambiguous legacy ownership }
        '429': { description: Management request limit exceeded }
  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: List invitations as OWNER/ADMIN
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ordered createdAt/id descending; expired pending records are projected as EXPIRED; secrets never returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManagementPage'
                  - properties: { items: { type: array, items: { $ref: '#/components/schemas/Invitation' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification required or management role insufficient }
        '404': { description: Organization absent or caller is not a member }
        '429': { description: Management request limit exceeded }
    post:
      summary: Invite an email to an allowed non-owner role
      description: Email normalized; OWNER can invite ADMIN/MEMBER/VIEWER and ADMIN only MEMBER/VIEWER. Token hash stored with 24-hour expiry. One pending invitation per tenant/email. Account need not exist. Await SMTP outside transaction; failure revokes this token generation. No membership is created yet.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
      responses:
        '201': { $ref: '#/components/responses/InvitationResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification or role policy rejected }
        '404': { description: Organization absent or caller is not a member }
        '409': { description: Existing membership or pending invitation }
        '429': { description: Invitation sending limit exceeded }
        '503': { description: SMTP delivery failed; create a new invitation }
  /organizations/{organizationId}/invitations/{invitationId}/reissue:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - { in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Rotate a pending or expired invitation with the same role/email
      description: Rechecks current actor permission and recipient membership. Replaces secret/expiry/inviter and invalidates the previous link. Accepted/revoked invitations require a new invitation.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmptyJson' }
      responses:
        '200': { $ref: '#/components/responses/InvitationResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification or role policy rejected }
        '404': { description: Organization or invitation absent in authorized scope }
        '409': { description: Accepted/revoked invitation or existing membership }
        '429': { description: Invitation reissue limit exceeded }
        '503': { description: SMTP delivery failed; create a new invitation }
  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - { in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke a non-accepted invitation as an authorized manager
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: { $ref: '#/components/requestBodies/EmptyJson' }
      responses:
        '204': { description: Revoked; repeating revocation is idempotent }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin, verification or role policy rejected }
        '404': { description: Organization or invitation absent in authorized scope }
        '409': { description: Invitation already accepted; manage the membership instead }
        '429': { description: Management request limit exceeded }
  /invitations/accept:
    post:
      summary: Accept a single-use invitation with its matching verified email
      description: Tenant/role come exclusively from the hashed token's record. Inviter's current role is rechecked under the organization lock. Existing memberships are never elevated. New accounts register/verify normally, then reopen the email fragment link. GET never accepts an invitation.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmailToken'
              additionalProperties: false
              properties:
                token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
      responses:
        '200':
          description: Membership, consumed invitation and audit committed together
          content:
            application/json:
              schema:
                type: object
                required: [organizationId]
                properties: { organizationId: { type: string, format: uuid } }
        '400': { description: Invalid, expired, consumed, revoked, replaced, wrong-email or no-longer-authorized invitation; generic response }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin rejected or recipient email unverified }
        '409': { description: Existing membership cannot be changed by invitation }
        '429': { description: Acceptance limit exceeded }
  /organizations/{organizationId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      summary: Read tenant audit as OWNER/ADMIN
      description: Ordered createdAt/id descending; selected non-secret metadata only. Personal login/logout events are not exposed by this route. No global audit endpoint.
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tenant-scoped audit records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManagementPage'
                  - properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verification required or management role insufficient }
        '404': { description: Organization absent or caller is not a member }
        '429': { description: Management request limit exceeded }
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: tc_access
      description: __Host-tc_access in HTTPS production; HttpOnly, SameSite=Lax, expires after 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: tc_refresh
      description: __Host-tc_refresh in HTTPS production; HttpOnly, SameSite=Lax, seven-day absolute lifetime.
  parameters:
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema: { type: string, format: uuid }
      description: UUIDv4 validated against current caller membership; not a trusted tenant claim
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri }
      description: Must exactly match WEB_ORIGIN. Cookies are not sufficient for mutations.
  requestBodies:
    EmailRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string, format: email, maxLength: 254 }
    EmptyJson:
      required: true
      content:
        application/json:
          schema: { type: object }
  schemas:
    Dashboard:
      type: object
      additionalProperties: false
      required: [members, membersByRole, pendingInvitations, recentActivity]
      properties:
        members: { type: integer, minimum: 0 }
        pendingInvitations: { type: integer, minimum: 0 }
        membersByRole:
          type: object
          additionalProperties: false
          required: [OWNER, ADMIN, MEMBER, VIEWER]
          properties:
            OWNER: { type: integer, minimum: 0 }
            ADMIN: { type: integer, minimum: 0 }
            MEMBER: { type: integer, minimum: 0 }
            VIEWER: { type: integer, minimum: 0 }
        recentActivity:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [id, action, resource, createdAt]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              resource: { type: string }
              createdAt: { type: string, format: date-time }
    RoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
    ManagementPage:
      type: object
      required: [items, limit, offset, hasMore]
      properties:
        items: { type: array, items: {} }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
    Member:
      type: object
      additionalProperties: false
      required: [id, role, createdAt, user]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER] }
        createdAt: { type: string, format: date-time }
        user:
          type: object
          additionalProperties: false
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, expiresAt, createdAt, updatedAt, acceptedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, MEMBER, VIEWER] }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorId, action, resource, resourceId, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        resource: { type: string }
        resourceId: { type: string }
        metadata: { type: object, additionalProperties: true, description: Explicit non-secret metadata such as role transitions or changed field names }
        createdAt: { type: string, format: date-time }
    OrganizationInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug:
          type: string
          minLength: 3
          maxLength: 48
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase ASCII letters/digits separated by single hyphens; reserved names rejected.
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug, role, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmailToken:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, emailVerifiedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        emailVerifiedAt: { type: [string, 'null'], format: date-time }
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }
  responses:
    InvitationResult:
      description: Public invitation projection after SMTP acknowledgement; no token/hash returned; Cache-Control no-store
      content:
        application/json:
          schema:
            type: object
            required: [invitation]
            properties:
              invitation: { $ref: '#/components/schemas/Invitation' }
    OrganizationResult:
      description: Public organization projection with the caller's role; Cache-Control no-store
      content:
        application/json:
          schema:
            type: object
            required: [organization]
            properties:
              organization: { $ref: '#/components/schemas/Organization' }
    EmailQueued:
      description: Generic response; queue is bounded/in-process and delivery is not guaranteed. Cache-Control is no-store.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    SessionCookies:
      description: Empty body; access and refresh Set-Cookie headers. Cache-Control is no-store.
      headers:
        Set-Cookie:
          schema: { type: string }
          description: Two host-only, Path=/, HttpOnly, SameSite=Lax cookies; Secure in production.
    Invalid:
      description: Invalid input or unknown fields; no submitted secret is echoed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials or absent/expired/revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OriginRejected:
      description: Missing or foreign Origin
    Throttled:
      description: Too many requests; 20/minute/endpoint/IP (60 for me, 5 for forgot-password/resend-verification). Email issuance also has a 60-second recipient/purpose cooldown.
