
services:
  postgres:
    image: postgres:17-alpine
    container_name: tenantcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenantcore
      POSTGRES_PASSWORD: tenantcore_local
      POSTGRES_DB: tenantcore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantcore -d tenantcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
