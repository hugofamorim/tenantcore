services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tenantcore
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: tenantcore_demo
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantcore -d tenantcore_demo"]
      interval: 2s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:12025:1025"
      - "127.0.0.1:28025:8025"
volumes:
  demo_postgres:
